# Guard against the single failure mode that kills this Hub silently.
#
# GitHub disables scheduled workflows in a PUBLIC repo after 60 days with no
# repository activity (docs/SPEC.md §8, verified 2026-09-03). If the Hub goes quiet
# for two months, every loop stops running — with no error, no notification, and
# nothing in the UI that looks wrong. The archive just stops growing.
#
# Two defences:
#   1. Weekly touch, so the 60-day inactivity clock never runs out.
#   2. A staleness check that opens an issue when loops stop producing, because
#      "the schedule is enabled" and "the loops are actually running" are not
#      the same claim.

name: keepalive

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Touch heartbeat
        run: |
          mkdir -p .github
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/HEARTBEAT
          git config user.name  "plotloop-hub[bot]"
          git config user.email "plotloop-hub[bot]@users.noreply.github.com"
          git add .github/HEARTBEAT
          git diff --cached --quiet || {
            git commit -m "chore: keepalive heartbeat"
            git push
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --disable-pip-version-check pyyaml

      - name: Detect stalled loops
        id: check
        run: python3 scripts/check_staleness.py --out "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Open an issue when loops have stalled
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ 有 loop 停止产出";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "staleness",
            });
            if (open.some(i => i.title === title)) {
              core.info("Staleness issue already open — not filing a duplicate.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["staleness"],
              body: [
                "`check_staleness.py` 检出有 loop 超过预期周期没有新产出。",
                "",
                `运行详情：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "常见原因：信源改版、凭证过期、schedule 被 GitHub 停用。",
                "参见 docs/SPEC.md §8 与 §9。",
              ].join("\n"),
            });
